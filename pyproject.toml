[project]
name = "livekit-prism"
version = "0.1.0"
description = "Dual-Channel Multimodal Tool Gateway & Agent Plugin for LiveKit and PostHog"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "livekit>=0.18.0",
    "livekit-api>=0.8.0",
    "livekit-agents>=0.12.0",
    "livekit-plugins-openai>=0.10.0",
    "livekit-plugins-silero>=0.7.0",
    "posthog>=3.5.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
